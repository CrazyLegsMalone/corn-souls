<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corn Souls — Crowbar Wall Mount Test v20</title><style>body{background:#06111f;color:#e5e8ed;font:16px system-ui;margin:3rem}pre{white-space:pre-wrap}</style></head><body><p id="status">Loading Corn Souls sandbox preview…</p><script>
(async()=>{
 const status=document.getElementById('status');
 try {
  // Defeat old preview caching. Keep current page available even if worker cleanup fails.
  if('serviceWorker' in navigator) {
    try {const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs) if(reg.scope.includes('/corn-souls/')) await reg.unregister();
    } catch(err) {}
  }
  const response=await fetch('../index.html?crowbar_mount_v20='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load live game: HTTP '+response.status);
  let html=await response.text();
  // Preview-only: start in first-person Squeeg mode, inside the maintenance shop.
  // Position is on the open shop floor, away from the two forklifts at z=37.
  const initMarker='try { P3.init(view); } catch (e)';
  if(!html.includes(initMarker)) throw new Error('Game initialization changed; cannot apply shop spawn safely.');
  html=html.replace(initMarker,
    'try { P3.init(view); P3.cam.tx = 28; P3.cam.tz = 27; P3.cam.yaw = 0.35; P3.walkStart(); setWalkUI(); } catch (e)');

  const crowbarEngine="\n/* Corn Souls: actual GLB crowbar A/B/C test. No external 3D loader required. */\nconst CROWBAR_CHOICES={ horror:{name:'Horror Game Crowbar — hvarley',file:'horror_game_crowbar.glb'} };\nconst CROWBAR_INSTANCES=[];\nconst CROWBAR_CACHE={};\nconst CROWBAR_FILES={};\nlet CROWBAR_CURRENT='horror';\nfunction crowbarAccessor(doc,bin,index){\n const a=doc.accessors[index],v=doc.bufferViews[a.bufferView],types={5120:[Int8Array,1],5121:[Uint8Array,1],5122:[Int16Array,2],5123:[Uint16Array,2],5125:[Uint32Array,4],5126:[Float32Array,4]},\n pair=types[a.componentType],size={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[a.type],n=a.count*size,\n byte=v.byteOffset||0,off=byte+(a.byteOffset||0),stride=v.byteStride||size*pair[1],out=new pair[0](n),view=new DataView(bin);\n for(let i=0;i<a.count;i++)for(let j=0;j<size;j++){\n  const at=off+i*stride+j*pair[1];\n  out[i*size+j]=a.componentType===5126?view.getFloat32(at,true):a.componentType===5125?view.getUint32(at,true):a.componentType===5123?view.getUint16(at,true):a.componentType===5121?view.getUint8(at):a.componentType===5122?view.getInt16(at,true):view.getInt8(at);\n }\n return {array:out,itemSize:size,normalized:!!a.normalized};\n}\nasync function crowbarReadGLB(url){\n const response=await fetch(url,{cache:'no-store'});\n if(!response.ok)throw Error('Model download HTTP '+response.status+' — '+url);\n const bytes=await response.arrayBuffer(),header=new DataView(bytes);\n if(header.getUint32(0,true)!==0x46546c67||header.getUint32(4,true)!==2)throw Error('Not a GLB 2.0 file');\n let json=null,bin=null,offset=12;\n while(offset<bytes.byteLength){\n  const n=header.getUint32(offset,true),kind=header.getUint32(offset+4,true);offset+=8;\n  if(kind===0x4e4f534a)json=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,offset,n)));\n  if(kind===0x004e4942)bin=bytes.slice(offset,offset+n);\n  offset+=n;\n }\n if(!json||!bin)throw Error('Incomplete GLB');\n const textures=(json.textures||[]).map(t=>{\n  const image=json.images[t.source],view=json.bufferViews[image.bufferView];\n  const data=bin.slice(view.byteOffset||0,(view.byteOffset||0)+view.byteLength);\n  const img=new Image(),objectUrl=URL.createObjectURL(new Blob([data],{type:image.mimeType||'image/png'}));\n  const tex=new T.Texture();tex.flipY=false;\n  if('colorSpace' in tex&&T.SRGBColorSpace)tex.colorSpace=T.SRGBColorSpace;\n  img.onload=()=>{tex.image=img;tex.needsUpdate=true;URL.revokeObjectURL(objectUrl);};\n  img.onerror=()=>URL.revokeObjectURL(objectUrl);\n  img.src=objectUrl;return tex;\n });\n const materials=(json.materials||[]).map(m=>{\n  const p=m.pbrMetallicRoughness||{},factor=p.baseColorFactor||[1,1,1,1];\n  return new T.MeshStandardMaterial({\n   color:new T.Color().setRGB(factor[0],factor[1],factor[2]),\n   map:p.baseColorTexture?textures[p.baseColorTexture.index]:null,\n   metalness:p.metallicFactor||0,roughness:p.roughnessFactor??.9,\n   side:m.doubleSided?T.DoubleSide:T.FrontSide,transparent:factor[3]<1,opacity:factor[3]\n  });\n });\n const meshObjs=(json.meshes||[]).map(m=>(m.primitives||[]).map(p=>{\n  if(p.mode!==undefined&&p.mode!==4)throw Error('Unsupported non-triangle primitive');\n  const geo=new T.BufferGeometry();\n  for(const [attribute,name] of [['POSITION','position'],['NORMAL','normal'],['TEXCOORD_0','uv'],['COLOR_0','color']]){\n   if(p.attributes[attribute]===undefined)continue;\n   const a=crowbarAccessor(json,bin,p.attributes[attribute]);\n   geo.setAttribute(name,new T.BufferAttribute(a.array,a.itemSize,a.normalized));\n  }\n  if(p.indices!==undefined){const a=crowbarAccessor(json,bin,p.indices);geo.setIndex(new T.BufferAttribute(a.array,1));}\n  if(!geo.attributes.normal)geo.computeVertexNormals();\n  return new T.Mesh(geo,materials[p.material]||new T.MeshStandardMaterial({color:'#888888'}));\n }));\n const objects=(json.nodes||[]).map(n=>{\n  const g=new T.Group();g.name=n.name||'';\n  if(n.matrix){const mat=new T.Matrix4().fromArray(n.matrix);g.matrix.copy(mat);g.matrix.decompose(g.position,g.quaternion,g.scale);}\n  else{if(n.translation)g.position.fromArray(n.translation);if(n.rotation)g.quaternion.fromArray(n.rotation);if(n.scale)g.scale.fromArray(n.scale);}\n  if(n.mesh!==undefined)meshObjs[n.mesh].forEach(m=>g.add(m.clone()));\n  return g;\n });\n (json.nodes||[]).forEach((n,i)=>(n.children||[]).forEach(id=>objects[i].add(objects[id])));\n const root=new T.Group(),scene=json.scenes?.[json.scene||0]||json.scenes?.[0];\n (scene?.nodes||[0]).forEach(i=>root.add(objects[i]));\n // Normalize the authentic model geometry, irrespective of Sketchfab export units.\n root.updateMatrixWorld(true);\n const b=new T.Box3().setFromObject(root),extent=b.getSize(new T.Vector3());\n const axis=extent.x>=extent.y&&extent.x>=extent.z?new T.Vector3(1,0,0):extent.y>=extent.z?new T.Vector3(0,1,0):new T.Vector3(0,0,1);\n const group=new T.Group();group.add(root);group.quaternion.setFromUnitVectors(axis,new T.Vector3(1,0,0));\n group.updateMatrixWorld(true);\n const bb=new T.Box3().setFromObject(group),center=bb.getCenter(new T.Vector3()),length=bb.getSize(new T.Vector3()).x;\n root.position.sub(center); // translation is inside rotated parent, so correct with group-local center below instead\n root.position.add(center);\n const normalized=new T.Group();normalized.add(group);\n normalized.scale.setScalar(.94/Math.max(.001,length));\n normalized.updateMatrixWorld(true);\n const cb=new T.Box3().setFromObject(normalized),c=cb.getCenter(new T.Vector3());\n normalized.position.sub(c);\n normalized.userData.noHit=true;\n return normalized;\n}\nfunction crowbarSlot(context,L){\n const g=new T.Group();g.userData.noHit=true;\n CROWBAR_INSTANCES.push({g,context,L});crowbarRefresh();\n return g;\n}\nfunction crowbarRefresh(){\n const promise=CROWBAR_CACHE[CROWBAR_CURRENT];\n if(!promise)return;\n promise.then(proto=>{\n  if(promise!==CROWBAR_CACHE[CROWBAR_CURRENT])return;\n  for(const slot of CROWBAR_INSTANCES){\n   slot.g.clear();\n   const visual=proto.clone(true);\n   visual.scale.multiplyScalar(slot.context==='hud'?slot.L/.94:slot.L/.94);\n   // The GLB is normalized along its long X axis. Use different orientations\n   // for the first-person grip and wall pegboard rather than one shared roll.\n   // First person: roll the hook 180 degrees from the previous inward-facing\n   // orientation so the claw opens away from Squeeg toward the impact point.\n   // Wall: quarter-roll to expose the claw's full silhouette flat against board.\n   if(slot.context==='hud') visual.rotation.set(0,0,0);\n   else if(slot.context==='wall'){\n     // The pegboard lies in its local XY plane, facing +Z.\n     // Set the crowbar's broad face toward the viewer and stand the actual\n     // 3-D geometry clear of the board instead of burying half inside it.\n     visual.rotation.set(0,0,0);\n     visual.position.z=0.17;\n   }\n   else visual.rotation.set(Math.PI,0,0);\n   visual.traverse(o=>{if(o.isMesh){o.userData.noHit=true;if(slot.context==='hud'){o.renderOrder=35;o.material=o.material.clone();o.material.depthTest=false;}}});\n   slot.g.add(visual);\n  }\n }).catch(err=>console.error('Crowbar GLB unavailable:',err));\n}\nfunction crowbarMessage(msg){\n let note=document.getElementById('crowbar-load-status');\n if(!note){note=document.createElement('div');note.id='crowbar-load-status';note.style.cssText='position:fixed;top:96px;right:12px;max-width:370px;z-index:2147483647;background:#611b19;color:white;padding:7px;font:12px monospace';document.body.append(note);}\n note.textContent=msg;\n}\nfunction crowbarPick(which){\n CROWBAR_CURRENT=which;\n \n if(!CROWBAR_CACHE[which])CROWBAR_CACHE[which]=crowbarReadGLB(CROWBAR_FILES[which]||'assets/models/horror_game_crowbar.glb');\n const warning=document.getElementById('crowbar-load-status');if(warning)warning.remove();\n crowbarRefresh();\n}\n\nsetTimeout(()=>{\n // Game asset loads directly from the repository; no picker or test HUD.\n CROWBAR_FILES.horror='assets/models/horror_game_crowbar.glb';\n crowbarPick('horror');\n},0);\n";
  const fp='const q = hudPart(g, new T.PlaneGeometry(L, L / 4), toolMat(k, true), 0.12, -0.12, -0.6); q.rotation.set(0, 0.35, 2.25);';
  const t3='const L = TOOLS[k].L, g = new T.Group(), m = new T.Mesh(new T.PlaneGeometry(L, L / 4), toolMat(k));';
  const wall='const L = TOOLS[k].L, m = new T.Mesh(new T.PlaneGeometry(L, L / 4), toolMat(k));';
  if(!html.includes(fp)||!html.includes(t3)||!html.includes(wall)||!html.includes('function makeTool(k) {')) throw Error('Game crowbar rendering code changed: model comparison patch not applied');
  html=html.replace('function makeTool(k) {', crowbarEngine+'\nfunction makeTool(k) {');
  html=html.replace(fp, "const q = k==='crowbar' ? crowbarSlot('hud',L) : hudPart(g, new T.PlaneGeometry(L,L/4),toolMat(k,true),0.12,-0.12,-0.6); if(k==='crowbar'){q.position.set(0.12,-0.12,-0.6);g.add(q);} q.rotation.set(0,0.35,2.25);");
  html=html.replace(t3, "const L=TOOLS[k].L,g=new T.Group(),m=k==='crowbar'?crowbarSlot('third',L):new T.Mesh(new T.PlaneGeometry(L,L/4),toolMat(k));");
  html=html.replace(wall, "const L=TOOLS[k].L,m=k==='crowbar'?crowbarSlot('wall',L):new T.Mesh(new T.PlaneGeometry(L,L/4),toolMat(k));");
  // Test HUD removed; automatic asset loading is silent.

  const cornEngine="\nconst CORN_PROPS_STATE={items:[],held:null,can:null,loaded:{},ready:false};\nfunction cornBuild(){\n if(CORN_PROPS_STATE.ready)return;CORN_PROPS_STATE.ready=true;\n const x=56+SH_DX-2.9,z=((NROAD+4.5)+(SCZ_OUT-4.5))/2;\n const body=new T.MeshLambertMaterial({color:0x3b494b,side:T.DoubleSide});\n const can=new T.Group();can.position.set(x,0,z+3.3);scene.add(can);\n const wall=new T.Mesh(new T.CylinderGeometry(.45,.38,.91,10,1,true),body);wall.position.y=.47;can.add(wall);\n const base=new T.Mesh(new T.CylinderGeometry(.38,.38,.07,10),body);base.position.y=.06;can.add(base);\n const rim=new T.Mesh(new T.TorusGeometry(.45,.05,5,12),new T.MeshLambertMaterial({color:0x1e292a}));rim.rotation.x=Math.PI/2;rim.position.y=.92;can.add(rim);CORN_PROPS_STATE.can=can;\n function make(type,a,b,c,inCan=false){\n  const g=new T.Group();g.position.set(a,b,c);scene.add(g);\n  const item={type,g,inCan,held:false,sleep:true,v:new T.Vector3(),spin:new T.Vector3(2,1.5,2.4)};CORN_PROPS_STATE.items.push(item);cornVisual(item);\n }\n for(const [dx,dz,dy] of [[-2,-2.1,.28],[-1.42,-2.1,.28],[-1.72,-2,.82],[-2,-1.53,.28]])make('cube',x+dx,dy,z+dz);\n for(let i=0;i<7;i++){const a=i*Math.PI*2/7;make('ear',x+Math.cos(a)*.19,.99+(i%3)*.08,z+3.3+Math.sin(a)*.18,true);}\n}\nfunction cornVisual(item){\n item.g.clear();const m=CORN_PROPS_STATE.loaded[item.type];\n if(m){\n   item.g.add(m.clone(true));\n   // Reinforced dark-green cube edges make this a playful CORN BLOCK, not a raw kernel.\n   if(item.type==='cube'){\n     const outline=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(.57,.57,.57)),\n       new T.LineBasicMaterial({color:0x254b3d,depthTest:true}));\n     outline.userData.noHit=true;item.g.add(outline);\n   }\n   return;\n }\n const geo=item.type==='cube'?new T.BoxGeometry(.52,.52,.52):new T.CylinderGeometry(.10,.12,.55,6);\n const mesh=new T.Mesh(geo,new T.MeshLambertMaterial({color:item.type==='cube'?0xcba33b:0xe1bf47}));\n item.g.add(mesh);\n}\nfunction cornModel(type,source){\n // Reuse test-build GLB loader; normalize to a useful physical scale.\n return crowbarReadGLB(source).then(raw=>{\n  const box=new T.Box3().setFromObject(raw),sz=box.getSize(new T.Vector3());\n  const max=Math.max(sz.x,sz.y,sz.z);\n  if(!Number.isFinite(max)||max<=0)throw Error('Invalid corn model geometry');\n  const g=new T.Group();g.add(raw);raw.scale.multiplyScalar((type==='cube'?.55:.62)/max);\n  g.updateMatrixWorld(true);const b=new T.Box3().setFromObject(g),center=b.getCenter(new T.Vector3());g.position.sub(center);\n  CORN_PROPS_STATE.loaded[type]=g;\n  for(const item of CORN_PROPS_STATE.items)if(item.type===type)cornVisual(item);\n });\n}\nfunction cornInteract(){\n if(!walk.on||walk.drive||walk.mow||walk.dead)return false;\n if(CORN_PROPS_STATE.held){const t=CORN_PROPS_STATE.held;t.held=false;t.sleep=false;t.v.set(0,.3,0);CORN_PROPS_STATE.held=null;return 'Set down corn';}\n camera.updateMatrixWorld();const dir=new T.Vector3();camera.getWorldDirection(dir);\n let best=null,min=9999;\n for(const t of CORN_PROPS_STATE.items){\n  if(t.held)continue;\n  const delta=t.g.position.clone().sub(camera.position),dist=delta.length(),forward=delta.dot(dir);\n  if(dist>3.3||forward<.15)continue;\n  const side=Math.sqrt(Math.max(0,dist*dist-forward*forward));\n  if(side>.85)continue;\n  const score=side+dist*.04;\n  if(score<min){min=score;best=t;}\n }\n if(!best&&CORN_PROPS_STATE.can){\n  const delta=CORN_PROPS_STATE.can.position.clone().add(new T.Vector3(0,.7,0)).sub(camera.position);\n  if(delta.length()<3.3&&delta.normalize().dot(dir)>.87)best=CORN_PROPS_STATE.items.find(i=>i.inCan&&!i.held&&i.sleep);\n }\n if(!best)return false;best.held=true;best.inCan=false;best.sleep=false;best.v.set(0,0,0);CORN_PROPS_STATE.held=best;\n return best.type==='cube'?'Picked up corn cube — fire to throw':'Picked up corn ear — fire to throw';\n}\nfunction cornThrow(){\n if(!CORN_PROPS_STATE.held||!walk.on)return false;\n const item=CORN_PROPS_STATE.held,dir=new T.Vector3();camera.getWorldDirection(dir);\n item.held=false;item.inCan=false;item.sleep=false;\n item.v.copy(dir).multiplyScalar(item.type==='cube'?7.5:9).add(new T.Vector3(0,2,0));CORN_PROPS_STATE.held=null;return true;\n}\nfunction cornUpdate(dt){\n if(!CORN_PROPS_STATE.ready||!walk.on)return;\n dt=Math.max(0,Math.min(.05,dt));\n const dir=new T.Vector3();camera.getWorldDirection(dir);\n for(const t of CORN_PROPS_STATE.items){\n  if(t.held){t.g.position.copy(camera.position).addScaledVector(dir,1.45).add(new T.Vector3(0,-.2,0));continue;}\n  if(t.sleep)continue;\n  t.v.y-=9.8*dt;t.g.position.addScaledVector(t.v,dt);\n  t.g.rotation.x+=t.spin.x*dt;t.g.rotation.y+=t.spin.y*dt;\n  const floor=t.type==='cube'?.27:.23;\n  if(t.g.position.y<=floor){t.g.position.y=floor;if(Math.abs(t.v.y)>.35){t.v.y*=-.23;t.v.x*=.75;t.v.z*=.75;}else{t.v.set(0,0,0);t.sleep=true;}}\n }\n}\n\nsetTimeout(()=>{\n cornModel('cube','assets/models/corn_cube.glb').catch(err=>console.error('Corn cube GLB unavailable:',err));\n cornModel('ear','assets/models/corn_low_poly.glb').catch(err=>console.error('Corn ear GLB unavailable:',err));\n},0);\n";
  const hookA='  clock += dt;';
  const hookB='function fire() {\n  if (!walk.on || walk.dead) return false;';
  const hookC='const r = P3.kiaToggle() || P3.radioToggle()';
  const hookD='try { P3.init(view); P3.cam.tx = 28; P3.cam.tz = 27; P3.cam.yaw = 0.35; P3.walkStart(); setWalkUI(); } catch (e)';
  const hookE='root.Plant3D = {';
  const checks={simUpdate:hookA,fire:hookB,interact:hookC,shopSpawn:hookD,plantExports:hookE};
  const missing=Object.entries(checks).filter(([key,val])=>!html.includes(val)).map(([key])=>key);
  if(missing.length)throw Error('Corn v16 patch mismatch: '+missing.join(', ')+'; source fetch status='+response.status);
  html=html.replace(hookE,cornEngine+'\nroot.Plant3D = { cornBuild:cornBuild, cornInteract:cornInteract,');
  const hudVis='  const show = walk.on && !walk.dead && !walk.drive && !walk.mow, fp = show && !VIEW.third;';
  if(!html.includes(hudVis))throw Error('Weapon visibility signature changed');
  html=html.replace(hudVis,'  const show = walk.on && !walk.dead && !walk.drive && !walk.mow, fp = show && !VIEW.third && !CORN_PROPS_STATE.held;');
  html=html.replace(hookA,'  clock += dt; cornUpdate(dt);');
  html=html.replace(hookB,'function fire() {\n  if (!walk.on || walk.dead) return false;\n  if(cornThrow())return true;');
  html=html.replace(hookC,'const r = P3.cornInteract() || P3.kiaToggle() || P3.radioToggle()');
  html=html.replace(hookD,'try { P3.init(view); P3.cam.tx = 28; P3.cam.tz = 27; P3.cam.yaw = 0.35; P3.walkStart(); setWalkUI(); P3.cornBuild(); } catch (e)');
  if(!html.includes('cornBuild:cornBuild, cornInteract:cornInteract') || !html.includes('P3.cornBuild();'))throw Error('Corn setup verification failed');
  // Test HUD removed; corn assets load without file selection.
  html=html.replace(/<head>/i,'<head><base href="../">');
  html=html.replace(/<script>if \(\(location\.protocol === 'https:'[\s\S]*?navigator\.serviceWorker\.register\('sw\.js'\)\.catch\(function \(\) \{\}\);<\/script>/,'');
  document.open();document.write(html);document.close();
 }catch(e){status.textContent='Test preview failed: '+e.message;}
})();
