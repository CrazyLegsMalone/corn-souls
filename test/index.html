  const crowbarEngine="\n/* Corn Souls: actual GLB crowbar A/B/C test. No external 3D loader required. */\nconst CROWBAR_CHOICES={ horror:{name:'Horror Game Crowbar — hvarley',file:'horror_game_crowbar.glb'} };\nconst CROWBAR_INSTANCES=[];\nconst CROWBAR_CACHE={};\nconst CROWBAR_FILES={};\nlet CROWBAR_CURRENT='horror';\nfunction crowbarAccessor(doc,bin,index){\n const a=doc.accessors[index],v=doc.bufferViews[a.bufferView],types={5120:[Int8Array,1],5121:[Uint8Array,1],5122:[Int16Array,2],5123:[Uint16Array,2],5125:[Uint32Array,4],5126:[Float32Array,4]},\n pair=types[a.componentType],size={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[a.type],n=a.count*size,\n byte=v.byteOffset||0,off=byte+(a.byteOffset||0),stride=v.byteStride||size*pair[1],out=new pair[0](n),view=new DataView(bin);\n for(let i=0;i<a.count;i++)for(let j=0;j<size;j++){\n  const at=off+i*stride+j*pair[1];\n  out[i*size+j]=a.componentType===5126?view.getFloat32(at,true):a.componentType===5125?view.getUint32(at,true):a.componentType===5123?view.getUint16(at,true):a.componentType===5121?view.getUint8(at):a.componentType===5122?view.getInt16(at,true):view.getInt8(at);\n }\n return {array:out,itemSize:size,normalized:!!a.normalized};\n}\nasync function crowbarReadGLB(url){\n const response=await fetch(url,{cache:'no-store'});\n if(!response.ok)throw Error('Model download HTTP '+response.status+' — '+url);\n const bytes=await response.arrayBuffer(),header=new DataView(bytes);\n if(header.getUint32(0,true)!==0x46546c67||header.getUint32(4,true)!==2)throw Error('Not a GLB 2.0 file');\n let json=null,bin=null,offset=12;\n while(offset<bytes.byteLength){\n  const n=header.getUint32(offset,true),kind=header.getUint32(offset+4,true);offset+=8;\n  if(kind===0x4e4f534a)json=JSON.parse(new TextDecoder().decode(new Uint8Array(bytes,offset,n)));\n  if(kind===0x004e4942)bin=bytes.slice(offset,offset+n);\n  offset+=n;\n }\n if(!json||!bin)throw Error('Incomplete GLB');\n const textures=(json.textures||[]).map(t=>{\n  const image=json.images[t.source],view=json.bufferViews[image.bufferView];\n  const data=bin.slice(view.byteOffset||0,(view.byteOffset||0)+view.byteLength);\n  const img=new Image(),objectUrl=URL.createObjectURL(new Blob([data],{type:image.mimeType||'image/png'}));\n  const tex=new T.Texture();tex.flipY=false;\n  if('colorSpace' in tex&&T.SRGBColorSpace)tex.colorSpace=T.SRGBColorSpace;\n  img.onload=()=>{tex.image=img;tex.needsUpdate=true;URL.revokeObjectURL(objectUrl);};\n  img.onerror=()=>URL.revokeObjectURL(objectUrl);\n  img.src=objectUrl;return tex;\n });\n const materials=(json.materials||[]).map(m=>{\n  const p=m.pbrMetallicRoughness||{},factor=p.baseColorFactor||[1,1,1,1];\n  return new T.MeshStandardMaterial({\n   color:new T.Color().setRGB(factor[0],factor[1],factor[2]),\n   map:p.baseColorTexture?textures[p.baseColorTexture.index]:null,\n   metalness:p.metallicFactor||0,roughness:p.roughnessFactor??.9,\n   side:m.doubleSided?T.DoubleSide:T.FrontSide,transparent:factor[3]<1,opacity:factor[3]\n  });\n });\n const meshObjs=(json.meshes||[]).map(m=>(m.primitives||[]).map(p=>{\n  if(p.mode!==undefined&&p.mode!==4)throw Error('Unsupported non-triangle primitive');\n  const geo=new T.BufferGeometry();\n  for(const [attribute,name] of [['POSITION','position'],['NORMAL','normal'],['TEXCOORD_0','uv'],['COLOR_0','color']]){\n   if(p.attributes[attribute]===undefined)continue;\n   const a=crowbarAccessor(json,bin,p.attributes[attribute]);\n   geo.setAttribute(name,new T.BufferAttribute(a.array,a.itemSize,a.normalized));\n  }\n  if(p.indices!==undefined){const a=crowbarAccessor(json,bin,p.indices);geo.setIndex(new T.BufferAttribute(a.array,1));}\n  if(!geo.attributes.normal)geo.computeVertexNormals();\n  return new T.Mesh(geo,materials[p.material]||new T.MeshStandardMaterial({color:'#888888'}));\n }));\n const objects=(json.nodes||[]).map(n=>{\n  const g=new T.Group();g.name=n.name||'';\n  if(n.matrix){const mat=new T.Matrix4().fromArray(n.matrix);g.matrix.copy(mat);g.matrix.decompose(g.position,g.quaternion,g.scale);}\n  else{if(n.translation)g.position.fromArray(n.translation);if(n.rotation)g.quaternion.fromArray(n.rotation);if(n.scale)g.scale.fromArray(n.scale);}\n  if(n.mesh!==undefined)meshObjs[n.mesh].forEach(m=>g.add(m.clone()));\n  return g;\n });\n (json.nodes||[]).forEach((n,i)=>(n.children||[]).forEach(id=>objects[i].add(objects[id])));\n const root=new T.Group(),scene=json.scenes?.[json.scene||0]||json.scenes?.[0];\n (scene?.nodes||[0]).forEach(i=>root.add(objects[i]));\n // Normalize the authentic model geometry, irrespective of Sketchfab export units.\n root.updateMatrixWorld(true);\n const b=new T.Box3().setFromObject(root),extent=b.getSize(new T.Vector3());\n const axis=extent.x>=extent.y&&extent.x>=extent.z?new T.Vector3(1,0,0):extent.y>=extent.z?new T.Vector3(0,1,0):new T.Vector3(0,0,1);\n const group=new T.Group();group.add(root);group.quaternion.setFromUnitVectors(axis,new T.Vector3(1,0,0));\n group.updateMatrixWorld(true);\n const bb=new T.Box3().setFromObject(group),center=bb.getCenter(new T.Vector3()),length=bb.getSize(new T.Vector3()).x;\n root.position.sub(center); // translation is inside rotated parent, so correct with group-local center below instead\n root.position.add(center);\n const normalized=new T.Group();normalized.add(group);\n normalized.scale.setScalar(.94/Math.max(.001,length));\n normalized.updateMatrixWorld(true);\n const cb=new T.Box3().setFromObject(normalized),c=cb.getCenter(new T.Vector3());\n normalized.position.sub(c);\n normalized.userData.noHit=true;\n return normalized;\n}\nfunction crowbarSlot(context,L){\n const g=new T.Group();g.userData.noHit=true;\n CROWBAR_INSTANCES.push({g,context,L});crowbarRefresh();\n return g;\n}\nfunction crowbarRefresh(){\n const promise=CROWBAR_CACHE[CROWBAR_CURRENT];\n if(!promise)return;\n promise.then(proto=>{\n  if(promise!==CROWBAR_CACHE[CROWBAR_CURRENT])return;\n  for(const slot of CROWBAR_INSTANCES){\n   slot.g.clear();\n   const visual=proto.clone(true);\n   // E[which]=crowbarReadGLB(CROWBAR_FILES[which]||'assets/models/horror_game_crowbar.glb');\n const warning=document.getElementById('crowbar-load-status');if(warning)warning.remove();\n crowbarRefresh();\n}\n\nsetTimeout(()=>{\n // Game asset loads directly from the repository; no picker or test HUD.\n CROWBAR_FILES.horror='assets/models/horror_game_crowbar.glb';\n crowbarPick('horror');\n},0);\n";
  const fp='const q = hudPart(g, new T.PlaneGeometry(L, L / 4), toolMat(k, true), 0.12, -0.12, -0.6); q.rotation.set(0, 0.35, 2.25);';
  const t3='const L = TOOLS[k].L, g = new T.Group(), m = new T.Mesh(new T.PlaneGeometry(L, L / 4), toolMat(k));';

  const cornEngine="\nconst CORN_PROPS_STATE={items:[],held:null,can:null,cans:[],loaded:{},ready:false};\n// The plant's existing circular colliders are shared by walking and vehicles.\n// Register each corn prop with that same collision system, with live positions.\nfunction cornSolid(x,z,r){\n const c=[x,z,r];extraCols.push(c);\n if(colliders)colliders.push(c);\n return c;\n}\nfunction cornSyncCollider(t){\n if(!t.col)return;\n const active=!t.held&&t.g.position.y<1.45;\n t.col[0]=active?t.g.position.x:1e5;\n t.col[1]=active?t.g.position.z:1e5;\n}\nfunction cornPlayerPushOut(){\n // Resolve the player's body against the corn props after the game's standard collision pass.\n if(!walk.on||walk.drive||walk.mow||walk.ride||walk.dead)return;\n if(walk.y>15||(walk.floor||0)>=2)return;\n const br=BODY_R||.28;\n for(let pass=0;pass<2;pass++){\n  for(const can of CORN_PROPS_STATE.cans){\n   const dx=walk.x-can.position.x,dz=walk.z-can.position.z,d=Math.hypot(dx,dz),min=.49+br;\n   if(d<min){\n    const nx=d>.001?dx/d:1,nz=d>.001?dz/d:0;\n    walk.x=can.position.x+nx*min;walk.z=can.position.z+nz*min;\n   }\n  }\n  for(const item of CORN_PROPS_STATE.items){\n   if(item.held)continue;\n   const p=item.g.position,h=item.type==='cube'?.52:.55;\n   if(p.y+h*.5<walk.y||p.y-h*.5>walk.y+1.7)continue;\n   const dx=walk.x-p.x,dz=walk.z-p.z,d=Math.hypot(dx,dz),min=br+item.radius;\n   if(d<min){\n    const nx=d>.001?dx/d:1,nz=d>.001?dz/d:0;\n    walk.x=p.x+nx*min;walk.z=p.z+nz*min;\n   }\n  }\n }\n}\nfunction cornBounce(t,nx,nz,restitution=.25){\n const d=t.v.x*nx+t.v.z*nz;\n if(d<0){t.v.x-=(1+restitution)*d*nx;t.v.z-=(1+restitution)*d*nz;}\n t.v.x*=.78;t.v.z*=.78;\n}\nfunction cornResolve(t){\n const p=t.g.position,r=t.radius;\n // Solid bucket sides and rim. Dropped or thrown corn cannot pass through them.\n for(const can of CORN_PROPS_STATE.cans){\n  const dx=p.x-can.position.x,dz=p.z-can.position.z;\n  const d=Math.hypot(dx,dz),limit=.49+r;\n  if(d>=limit||p.y-r>.99||p.y+r<.03)continue;\n  if(p.y>.83&&p.y-r>.68&&t.v.y<=0){\n   p.y=.97+r;t.v.y=Math.max(0,-t.v.y*.18);\n   t.v.x*=.6;t.v.z*=.6;continue;\n  }\n  const nx=d>.0001?dx/d:1,nz=d>.0001?dz/d:0;\n  p.x=can.position.x+nx*limit;p.z=can.position.z+nz*limit;\n  cornBounce(t,nx,nz);\n }\n // World walls: use their real line segments, including height-limited obstacles.\n for(const [ax,az,bx,bz,ylo,yhi] of wallSegs){\n  if(ylo!==undefined&&(p.y+r<ylo||p.y-r>yhi))continue;\n  const vx=bx-ax,vz=bz-az,len=vx*vx+vz*vz||1;\n  const f=Math.max(0,Math.min(1,((p.x-ax)*vx+(p.z-az)*vz)/len));\n  const hx=ax+f*vx,hz=az+f*vz,dx=p.x-hx,dz=p.z-hz,d=Math.hypot(dx,dz);\n  if(d>=r)continue;\n  const nx=d>.0001?dx/d:-vz/Math.sqrt(len);\n  const nz=d>.0001?dz/d:vx/Math.sqrt(len);\n  p.x=hx+nx*r;p.z=hz+nz*r;cornBounce(t,nx,nz);\n }\n // Corn-on-corn: resting and moving cubes/ears have their own small hit volumes.\n for(const other of CORN_PROPS_STATE.items){\n  if(other===t||other.held)continue;\n  const o=other.g.position,dx=p.x-o.x,dz=p.z-o.z,dy=p.y-o.y;\n  const rr=r+other.radius,d2=dx*dx+dz*dz+dy*dy;\n  if(d2>=rr*rr)continue;\n  const horizontal=Math.hypot(dx,dz);\n  if(horizontal<.0001&&Math.abs(dy)>rr*.5){\n   const sign=dy>=0?1:-1;p.y=o.y+sign*rr;\n   t.v.y=sign*Math.abs(t.v.y)*.2;\n  }else{\n   const nx=horizontal>.0001?dx/horizontal:1;\n   const nz=horizontal>.0001?dz/horizontal:0;\n   const need=Math.sqrt(Math.max(0,rr*rr-dy*dy));\n   p.x=o.x+nx*need;p.z=o.z+nz*need;\n   cornBounce(t,nx,nz);\n  }\n }\n}\nfunction cornBuild(){\n if(CORN_PROPS_STATE.ready)return;CORN_PROPS_STATE.ready=true;\n const x=56+SH_DX-2.9,z=((NROAD+4.5)+(SCZ_OUT-4.5))/2;\n const body=new T.MeshLambertMaterial({color:0x3b494b,side:T.DoubleSide});\n const can=new T.Group();can.position.set(x,0,z+3.3);scene.add(can);CORN_PROPS_STATE.cans.push(can);cornSolid(x,z+3.3,.49);\n const wall=new T.Mesh(new T.CylinderGeometry(.45,.38,.91,10,1,true),body);wall.position.y=.47;can.add(wall);\n const base=new T.Mesh(new T.CylinderGeometry(.38,.38,.07,10),body);base.position.y=.06;can.add(base);\n const rim=new T.Mesh(new T.TorusGeometry(.45,.05,5,12),new T.MeshLambertMaterial({color:0x1e292a}));rim.rotation.x=Math.PI/2;rim.position.y=.92;can.add(rim);CORN_PROPS_STATE.can=can;\n function make(type,a,b,c,inCan=false){\n  const g=new T.Group();g.position.set(a,b,c);scene.add(g);\n  const item={type,g,inCan,held:false,sleep:true,radius:type==='cube'?.32:.18,v:new T.Vector3(),spin:new T.Vector3(2,1.5,2.4),col:cornSolid(a,c,type==='cube'?.32:.18)};CORN_PROPS_STATE.items.push(item);cornVisual(item);\n }\n for(const [dx,dz,dy] of [[-2,-2.1,.28],[-1.42,-2.1,.28],[-1.72,-2,.82],[-2,-1.53,.28]])make('cube',x+dx,dy,z+dz);\n for(let i=0;i<7;i++){const a=i*Math.PI*2/7;make('ear',x+Math.cos(a)*.19,.99+(i%3)*.08,z+3.3+Math.sin(a)*.18,true);}\n // Second prop station: outside the east wall of the three-pit grain receiving building.\n // Receiving spans x=-202..-172 and z=-12..12 before GDX/GDZ.\n // Keep clear of rail pit 1 and truck pits 2/3, plus north/south truck doors.\n const rx=-172+GDX+5.5, rz=-12+GDZ+5.5;\n // Move the grain receiving bucket and its low-poly ears 2 ft west (0.6096 m).\n const bucketX=rx-0.6096;\n const recvCan=new T.Group();recvCan.position.set(bucketX,0,rz);scene.add(recvCan);CORN_PROPS_STATE.cans.push(recvCan);cornSolid(bucketX,rz,.49);\n const recvWall=new T.Mesh(new T.CylinderGeometry(.45,.38,.91,10,1,true),body);recvWall.position.y=.47;recvCan.add(recvWall);\n const recvBase=new T.Mesh(new T.CylinderGeometry(.38,.38,.07,10),body);recvBase.position.y=.06;recvCan.add(recvBase);\n const recvRim=new T.Mesh(new T.TorusGeometry(.45,.05,5,12),new T.MeshLambertMaterial({color:0x1e292a}));recvRim.rotation.x=Math.PI/2;recvRim.position.y=.92;recvCan.add(recvRim);\n for(const [dx,dz,dy] of [[-1.7,-2.1,.28],[-1.1,-2.1,.28],[-1.4,-1.9,.82],[-1.7,-1.5,.28]])make('cube',rx+dx,dy,rz+dz);\n for(let i=0;i<7;i++){const a=i*Math.PI*2/7;make('ear',bucketX+Math.cos(a)*.19,.99+(i%3)*.08,rz+Math.sin(a)*.18,true);}\n}\nfunction cornVisual(item){\n item.g.clear();const m=CORN_PROPS_STATE.loaded[item.type];\n if(m){\n   item.g.add(m.clone(true));\n   // Reinforced dark-green cube edges make this a playful CORN BLOCK, not a raw kernel.\n   if(item.type==='cube'){\n     const outline=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(.57,.57,.57)),\n       new T.LineBasicMaterial({color:0x254b3d,depthTest:true}));\n     outline.userData.noHit=true;item.g.add(outline);\n   }\n   return;\n }\n const geo=item.type==='cube'?new T.BoxGeometry(.52,.52,.52):new T.CylinderGeometry(.10,.12,.55,6);\n const mesh=new T.Mesh(geo,new T.MeshLambertMaterial({color:item.type==='cube'?0xcba33b:0xe1bf47}));\n item.g.add(mesh);\n}\nfunction cornModel(type,source){\n // Reuse test-build GLB loader; normalize to a useful physical scale.\n return crowbarReadGLB(source).then(raw=>{\n  const box=new T.Box3().setFromObject(raw),sz=box.getSize(new T.Vector3());\n  const max=Math.max(sz.x,sz.y,sz.z);\n  if(!Number.isFinite(max)||max<=0)throw Error('Invalid corn model geometry');\n  const g=new T.Group();g.add(raw);raw.scale.multiplyScalar((type==='cube'?.55:.62)/max);\n  g.updateMatrixWorld(true);const b=new T.Box3().setFromObject(g),center=b.getCenter(new T.Vector3());g.position.sub(center);\n  CORN_PROPS_STATE.loaded[type]=g;\n  for(const item of CORN_PROPS_STATE.items)if(item.type===type)cornVisual(item);\n });\n}\nfunction cornInteract(){\n if(!walk.on||walk.drive||walk.mow||walk.dead)return false;\n if(CORN_PROPS_STATE.held){const t=CORN_PROPS_STATE.held;t.held=false;t.sleep=false;t.v.set(0,.3,0);CORN_PROPS_STATE.held=null;return 'Set down corn';}\n camera.updateMatrixWorld();const dir=new T.Vector3();camera.getWorldDirection(dir);\n let best=null,min=9999;\n for(const t of CORN_PROPS_STATE.items){\n  if(t.held)continue;\n  const delta=t.g.position.clone().sub(camera.position),dist=delta.length(),forward=delta.dot(dir);\n  if(dist>3.3||forward<.15)continue;\n  const side=Math.sqrt(Math.max(0,dist*dist-forward*forward));\n  if(side>.85)continue;\n  const score=side+dist*.04;\n  if(score<min){min=score;best=t;}\n }\n if(!best){\n  for(const can of CORN_PROPS_STATE.cans){\n   const delta=can.position.clone().add(new T.Vector3(0,.7,0)).sub(camera.position);\n   if(delta.length()<3.3&&delta.normalize().dot(dir)>.87){\n    best=CORN_PROPS_STATE.items.find(i=>i.inCan&&!i.held&&i.sleep&&\n      Math.hypot(i.g.position.x-can.position.x,i.g.position.z-can.position.z)<.5);\n    if(best)break;\n   }\n  }\n }\n if(!best)return false;best.held=true;best.inCan=false;best.sleep=false;best.v.set(0,0,0);CORN_PROPS_STATE.held=best;\n return best.type==='cube'?'Picked up corn cube — fire to throw':'Picked up corn ear — fire to throw';\n}\nfunction cornThrow(){\n if(!CORN_PROPS_STATE.held||!walk.on)return false;\n const item=CORN_PROPS_STATE.held,dir=new T.Vector3();camera.getWorldDirection(dir);\n item.held=false;item.inCan=false;item.sleep=false;\n item.v.copy(dir).multiplyScalar(item.type==='cube'?7.5:9).add(new T.Vector3(0,2,0));CORN_PROPS_STATE.held=null;return true;\n}\nfunction cornUpdate(dt){\n if(!CORN_PROPS_STATE.ready||!walk.on)return;\n dt=Math.max(0,Math.min(.05,dt));\n const dir=new T.Vector3();camera.getWorldDirection(dir);\n for(const t of CORN_PROPS_STATE.items){\n  if(t.held){\n   t.g.position.copy(camera.position).addScaledVector(dir,1.45).add(new T.Vector3(0,-.2,0));\n   cornSyncCollider(t);continue;\n  }\n  if(t.sleep){cornSyncCollider(t);continue;}\n  // Small substeps prevent a fast-thrown ear from tunneling through thin walls/bins.\n  const steps=Math.min(12,Math.max(1,Math.ceil(t.v.length()*dt/(t.radius*.6))));\n  const h=dt/steps;\n  for(let i=0;i<steps;i++){\n   t.v.y-=9.8*h;t.g.position.addScaledVector(t.v,h);\n   cornResolve(t);\n   const floor=t.type==='cube'?.27:.23;\n   if(t.g.position.y<=floor){\n    t.g.position.y=floor;\n    if(Math.abs(t.v.y)>.35){t.v.y*=-.23;t.v.x*=.75;t.v.z*=.75;}\n    else{t.v.set(0,0,0);t.sleep=true;break;}\n   }\n  }\n  t.g.r
