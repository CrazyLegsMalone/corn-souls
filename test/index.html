  // A real Three.js crowbar replaces the old flat texture in first person,

  const modelCode="\nfunction makeCrowbar3D(hud=false) {\n  const G=new T.Group(); G.userData.noHit=true;\n  const paint=['#6f251f','#893227','#a94032','#9a392e','#70221e','#ad5140','#59403a','#7c3730'];\n  const metal=['#292c30','#47494a','#55585a','#73716d','#3c4145','#89867f'];\n  let seed=85437;\n  const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};\n  function tubular(points,radius,palette,seg=20) {\n    const curve=points.length===2?new T.LineCurve3(new T.Vector3(...points[0]),new T.Vector3(...points[1])):new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));\n    const geo=new T.TubeGeometry(curve,seg,radius,6,false);\n    const colors=[];\n    const c=new T.Color();\n    for(let i=0;i<geo.attributes.position.count;i++){\n      const t=Math.floor(i/7);\n      const pick=Math.floor((t*19+Math.floor(rand()*5))%palette.length);\n      c.set(palette[pick]);\n      const scale=(i%7===0||i%7===6)?.72:1;\n      colors.push(c.r*scale,c.g*scale,c.b*scale);\n    }\n    geo.setAttribute('color',new T.Float32BufferAttribute(colors,3));\n    const material=hud?new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide,depthTest:false}):new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide});\n    const m=new T.Mesh(geo,material);m.userData.noHit=true;G.add(m);return m;\n  }\n  // Stout red bar with genuinely faceted geometry, not a billboard sprite.\n  tubular([[-.46,0,0],[.34,0,0]],.028,paint,34);\n  // Flattened steel wedge at the handle's opposite end.\n  tubular([[-.49,-.005,0],[-.44,0,0]],.024,metal,3);\n  const heel=new T.Mesh(new T.BoxGeometry(.07,.035,.044),new T.MeshBasicMaterial({color:0x626669,depthTest:!hud}));\n  heel.position.set(-.475,-.009,0);heel.rotation.z=-.13;G.add(heel);\n  // Dark forged hook with short, believable bend. Open inward-facing jaws.\n  tubular([[.32,0,0],[.37,.016,0],[.405,.065,0],[.415,.122,0],[.387,.165,0],[.35,.172,0]],.028,metal,18);\n  // Two distinct tapered prongs with a clear op
