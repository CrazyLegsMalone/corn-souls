<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corn Souls LIVE · Developer Inbox</title><meta name="theme-color" content="#06111f">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#e6efff;font:16px system-ui,sans-serif;line-height:1.5}
main{margin:0 auto}
a{color:#91ccff}button,input{font:inherit;border-radius:8px;min-height:44px}button{border:1px solid #4a647d;background:#214d79;color:#fff;padding:9px 13px;cursor:pointer;margin:4px}
button.primary{background:#1673ba;border-color:#1673ba}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ffc83b}
input{width:100%;border:1px solid #516980;background:#102336;color:#fff;padding:9px;margin:5px 0 15px}
label{display:block}
.msg{display:block;text-align:left;width:100%;padding:13px;margin:8px 0;background:#10283c;border:1px solid #3c5a73;overflow-wrap:anywhere}
.muted{color:#b5c6d5;font-size:14px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#status{min-height:24px;color:#ffe3a3;white-space:pre-wrap}#login,#reports,#detail{display:none}

main{max-width:940px;padding:12px 16px 28px}
section{background:#10263b;border:1px solid #46647b;border-radius:12px;margin-top:10px;padding:13px}
h1{font-size:clamp(20px,3vw,27px);margin:8px 0}h2{margin:4px 0 8px}
button{background:#214a70!important;color:#fff!important;border:1px solid #6d96b8!important;font-weight:650}
button:disabled{opacity:.4}
#reports>.row:nth-of-type(2){display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#reports>.row:nth-of-type(2) button{width:100%;margin:0;min-height:48px}
#reports button[aria-pressed="true"]{background:#d4eafa!important;color:#08233b!important}
#messages{max-height:40dvh;overflow-y:auto;overscroll-behavior:contain}
#messages .msg{background:#183750!important;color:white!important;border:1px solid #7296af!important;min-height:64px;white-space:pre-wrap;font-weight:500;border-radius:10px}
#reports>.row:last-child{justify-content:space-between}
#status{font-size:13px;min-height:22px;margin:5px 0}
@media(max-height:500px){section{padding:9px}#messages{max-height:34dvh}}
</style></head><body><main>
<a href="/corn-souls/index.html">← Back to LIVE game</a>
<h1>Developer Messages</h1>
<p class="muted">Select a category, then choose a message to read.</p>
<p id="status" role="status" aria-live="polite">Loading inbox…</p>
<section id="login"><h2>Developer sign in</h2><form id="authForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="signIn" class="primary" type="submit">Sign in</button></form></section>
<section id="reports"><div class="row"><h2>Messages</h2><button id="refresh">Refresh</button><button id="logout">Sign out</button></div>
<div class="row"><button data-filter="unread">● Unread</button><button data-filter="all">All messages</button><button data-filter="resolved">✓ Resolved</button></div><div id="messages"></div><div class="row"><button id="prev">← Previous</button><button id="next">Next →</button></div></section>
<section id="detail"><button id="back">← Messages</button><h2 id="detailTitle"></h2><p id="detailMeta" class="muted"></p><div id="detailBody" class="body"></div><div id="detailImage"></div><button id="resolve">Mark resolved</button></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let config=null,session=null,page=0,filter='unread',lastCount=0,currentReport=null,busy=false;
function show(id){for(const k of ['login','reports','detail'])$(k).style.display=k===id?'block':'none';}
function status(msg){$('status').textContent=msg||'';}
function button(text,fn){const b=document.createElement('button');b.className='msg';b.type='button';b.textContent=text;b.addEventListener('click',fn);return b;}
function checkConfig(obj){if(!obj||!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(obj.url||'')||!/^(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+)$/.test(obj.publicKey||''))throw Error('Inbox public configuration is unavailable.');return obj;}
async function request(path,options={},auth=false){
 if(!config)throw Error('Inbox is not configured.');
 if(auth&&(!session||Date.now()>=session.expires)){session=null;show('login');throw Error('Session expired. Sign in again.');}
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
 try{
  const headers={'apikey':config.publicKey,'Content-Type':'application/json',...options.headers};
  if(auth)headers.Authorization='Bearer '+session.token;
  const r=await fetch(config.url+path,{...options,headers,signal:controller.signal});
  if(!r.ok)throw Error(r.status===401||r.status===403?'Access denied or session expired.':('Inbox request failed (HTTP '+r.status+').'));
  return r.status===204?null:await r.json();
 }finally{clearTimeout(timeout);}
}
async function signIn(ev){
 ev.preventDefault();if(busy)return;busy=true;$('signIn').disabled=true;
 const email=$('email').value.trim(),password=$('password').value;$('password').value='';
 try{
  status('Signing in…');
  const data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  if(!data||typeof data.access_token!=='string'||typeof data.expires_in!=='number')throw Error('Authentication response was incomplete.');
  session={token:data.access_token,expires:Date.now()+data.expires_in*1000-30000};
  const admin=await request('/rest/v1/rpc/cs_is_report_admin',{method:'POST',body:'{}'},true);
  if(admin!==true){session=null;throw Error('This account is not approved for the developer inbox.');}
  page=0;await loadReports();
 }catch(e){session=null;show('login');status(e.message||'Sign-in failed.');}
 finally{busy=false;$('signIn').disabled=false;}
}
async function loadReports(){
 if(!session){show('login');return;}
 show('reports');status('Loading reports…');
 try{
  const query=filter==='unread'?'&read_at=is.null&resolved=eq.false':filter==='resolved'?'&resolved=eq.true':'';
  const rows=await request('/rest/v1/cs_reports?select=id,created_at,kind,name,body,build,device,read_at,resolved&order=created_at.desc,id.desc&limit=21&offset='+(page*20)+query,{},true);
  if(!Array.isArray(rows))throw Error('Inbox returned an invalid report list.');
  document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));
  lastCount=rows.length;
  const el=$('messages');el.replaceChildren();
  for(const r of rows.slice(0,20)){
   if(!r||!r.id)continue;
   el.append(button((r.read_at?'':'● ')+(r.name||'Anonymous')+' · '+(r.kind||'Message')+' · '+(r.created_at?new Date(r.created_at).toLocaleString():'')+'\n'+String(r.body||'').slice(0,150),()=>openReport(r.id)));
  }
  if(!el.children.length)el.textContent='No messages in this category.';
  $('prev').disabled=page===0;$('next').disabled=lastCount<=20;
  status('Page '+(page+1)+' · '+filter+' · '+Math.min(20,rows.length)+' messages');
 }catch(e){status(e.message||'Unable to load reports.');}
}
async function openReport(id){
 if(!session)return;status('Loading report…');
 try{
  const rows=await request('/rest/v1/cs_reports?select=*&id=eq.'+encodeURIComponent(id),{},true);
  if(!Array.isArray(rows)||!rows[0])throw Error('Report was not found.');
  currentReport=rows[0];const r=currentReport;
  $('detailTitle').textContent=(r.kind||'Report')+' — '+(r.name||'Anonymous');
  $('detailMeta').textContent=[r.build,r.device,r.location,r.created_at?new Date(r.created_at).toLocaleString():null].filter(Boolean).join(' · ');
  $('detailBody').textContent=String(r.body||'');$('detailImage').replaceChildren();
  if(typeof r.screenshot==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(r.screenshot)){
   const img=document.createElement('img');img.alt='Report screenshot';img.style.maxWidth='100%';img.src=r.screenshot;$('detailImage').append(img);
  }
  $('resolve').textContent=r.resolved?'Reopen report':'Mark resolved';
  show('detail');status('');
  if(!r.read_at){await request('/rest/v1/cs_reports?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({read_at:new Date().toISOString()})},true);}
 }catch(e){status(e.message||'Could not open report.');}
}
$('authForm').addEventListener('submit',signIn);
$('refresh').addEventListener('click',loadReports);
$('logout').addEventListener('click',()=>{if(session)request('/auth/v1/logout',{method:'POST'},true).catch(()=>{});session=null;currentReport=null;show('login');status('Signed out.');});
$('back').addEventListener('click',loadReports);
$('prev').addEventListener('click',()=>{if(page>0){page--;loadReports();}});
$('next').addEventListener('click',()=>{if(lastCount>20){page++;loadReports();}});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;page=0;loadReports();}));
$('resolve').addEventListener('click',async()=>{
 if(!currentReport)return;
 try{
  await request('/rest/v1/cs_reports?id=eq.'+encodeURIComponent(currentReport.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({resolved:!currentReport.resolved})},true);
  await openReport(currentReport.id);
 }catch(e){status(e.message||'Could not update report.');}
});
(async()=>{try{const r=await fetch('/corn-souls/inbox-config.json',{cache:'no-store'});if(!r.ok)throw Error('Inbox configuration could not load.');config=checkConfig(await r.json());show('login');status('');}catch(e){status(e.message||'Inbox unavailable.');}})();
</script></body></html>
