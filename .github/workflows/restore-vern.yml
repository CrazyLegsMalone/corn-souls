name: Restore Vern and NPC dialogue to live game
on:
  push:
    paths:
      - '.github/workflows/restore-vern.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Recover verified Vern build and set version
        run: |
          git show e87c3067f53e1ccc987389ea0e5b0c7ddb39ece6:index.html > /tmp/vern-game.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/vern-game.html')
          s=p.read_text()
          if len(s)<2000000 or 'NPC_DEF' not in s or 'Vern' not in s:
              raise SystemExit('Vern game validation failed; not deploying')
          s=s.replace("window.APP_VERSION = '1.91';","window.APP_VERSION = '1.92';")
          Path('game.html').write_text(s)
          PY
      - name: Commit recovered game and clean temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-vern.yml
          git add game.html .github/workflows/restore-vern.yml
          git commit -m "Restore Vern and NPC dialogue in game.html; set Alpha v1.92"
          git push origin HEAD:main
