name: Fix Corn Souls version label
on:
  push:
    paths:
      - '.github/workflows/fix-version-label.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update displayed version to Alpha v1.92
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "window.APP_VERSION = '1.91';"
          new = "window.APP_VERSION = '1.92';"
          if old not in s:
              raise SystemExit("Expected version declaration not found; refusing to modify")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit version label and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-version-label.yml
          git add index.html .github/workflows/fix-version-label.yml
          git commit -m "Set Corn Souls displayed version to Alpha v1.92"
          git push origin HEAD:main
