name: Validate launchers

# Guards the fragile part of this project: both launchers patch a 3.3 MB
# single-file game with ~60 ordered string replacements. A missing anchor either
# throws at load or silently disables a feature. This runs on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launchers:
    name: Launcher anchors + LIVE wiring (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Every patch anchor matches the game source
        run: python scripts/check_launcher_anchors.py
      - name: LIVE version / cache / refresh / validator agree
        run: python scripts/sync_test_to_live.py --consistency

  suites:
    name: Gameplay suites (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repo-root suites (LIVE side, plus helpers that read test/ paths)
        run: |
          # Report every suite; never stop at the first failure.
          fail=0
          for f in test/validate-live-promotion.cjs test/validate-traffic.cjs \
                   test/validate-acid.cjs test/validate-npc.cjs \
                   test/validate-rail-phone.cjs test/validate-power-outage.cjs \
                   test/validate-power-outage-machines.cjs \
                   test/validate-door-audio.cjs test/validate-notes.cjs \
                   test/validate-sound.cjs; do
            if node "$f"; then echo "::notice::PASS $f"; else echo "::warning::FAIL $f"; fail=1; fi
          done
          exit $fail
      - name: test/ suites (compare test/game.html against game.html)
        working-directory: test
        run: |
          # validate-inbox.cjs is back in (v1.97.198): its mock now has `window`
          # and it reads the TEST files next to it from either directory.
          fail=0
          for f in validate-west-wing.cjs validate-windsocks.cjs \
                   validate-mcc-extinguisher.cjs validate-vulture.cjs \
                   validate-seating.cjs validate-interior-dark.cjs \
                   validate-performance.cjs validate-ground-layers.cjs \
                   validate-gun-magazine.cjs validate-frame-stability.cjs \
                   validate-ranger.cjs validate-water.cjs validate-pivot.cjs \
                   validate-game-clock.cjs validate-vehicle-cabins.cjs \
                   validate-corn-creatures.cjs validate-two-player.cjs validate-corn-sync.cjs validate-critter-sync.cjs validate-critter-powers.cjs validate-siding.cjs validate-doors.cjs validate-nibblers.cjs validate-trees.cjs validate-grass.cjs validate-grain-pile.cjs validate-title.cjs validate-critter-eat.cjs validate-exit-signs.cjs validate-mesh-doors.cjs validate-fire.cjs validate-hydrant.cjs validate-roofmap.cjs validate-title-render.cjs validate-mower-shed.cjs validate-frame-loop.cjs validate-grass-grid.cjs validate-minimap.cjs validate-sprite-mirror.cjs validate-corn-brush.cjs validate-haulers.cjs validate-indoor-sound.cjs validate-headlights.cjs validate-ammonia-cloud.cjs validate-roll-auto.cjs validate-creep-kick.cjs validate-skinned-npcs.cjs validate-duck-sync.cjs validate-smoking-area.cjs validate-skinned-players.cjs validate-drawcall-batch.cjs validate-skin-batch.cjs validate-perf-leaks.cjs validate-bugfix-batch.cjs validate-inbox.cjs validate-cleanup.cjs validate-quality-menu.cjs validate-lesion.cjs validate-npc-dialogue.cjs validate-phone-pacing.cjs validate-fp-body.cjs validate-player-health.cjs validate-zombies.cjs validate-models-3-0.cjs validate-farm-animals.cjs validate-rat-model.cjs validate-critter-models.cjs; do
            if node "$f"; then echo "::notice::PASS test/$f"; else echo "::warning::FAIL test/$f"; fail=1; fi
          done
          exit $fail
